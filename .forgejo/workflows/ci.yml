name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Without a group: a newer run cancels the older run of the same branch, except on main, where every run finishes.
concurrency:
  cancel-in-progress: ${{ forgejo.ref != 'refs/heads/main' }}

env:
  GOPRIVATE: git.kloudbox.de/commons/*
  # CI builds what go.mod names, never a workspace file a host could hand down.
  GOWORK: "off"

jobs:
  qa:
    runs-on: oracle-arm64-host
    # Measured 2026-11-23 on the Ampere: 69 s warm, 87 s with the final stack test (Keycloak healthy in 36 s). A cold
    # pull and a cold Keycloak add about 3 minutes (estimated from the Mac's download, withdb's startBound), a failed
    # start's teardown seconds: 30 leaves wide margin.
    timeout-minutes: 30
    steps:
      - uses: https://data.forgejo.org/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: https://data.forgejo.org/actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: '1.27.4'
          cache: false
      - run: make qa
