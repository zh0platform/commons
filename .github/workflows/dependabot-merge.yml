name: Dependabot merge

# Asks GitHub to merge Dependabot's grouped minor and patch pull requests, version and security updates, by themselves.
# GitHub merges once the required checks (qa on both runners, Secrets) are green on a branch up to date with main.
# Majors, Keycloak (left out of the groups in dependabot.yml) and every pull request a person opened wait for a person.
# Only organization admins can push to a Dependabot branch here, and the required checks run on the merged tree, so no
# commit count is checked. The job checks out nothing and uses no action.
on: pull_request

permissions:
  contents: read

jobs:
  merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.pull_request.head.ref }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - name: Turn on auto-merge for a group pull request
        shell: bash
        run: |
          # Dependabot names a group branch dependabot/<ecosystem>/<directory>/<group>[-<hash>]; only the two groups of
          # .github/dependabot.yml match, never a single dependency's branch.
          if ! [[ "$BRANCH" =~ ^dependabot/.+/(security-)?minor-and-patch(-[0-9a-f]+)?$ ]]; then
            echo "Not a group branch: $BRANCH"; exit 0
          fi
          gh pr merge "$NUMBER" --auto --merge --match-head-commit "$HEAD_SHA"
