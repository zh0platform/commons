name: Secrets

# Every pull request and every push to main is scanned for secrets, documentation included: no path filter.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels its superseded run; each run scans every commit since the scans began, so a
# commit a cancelled or skipped run left out is scanned by the next one. Each push to main has a group of its own (its
# run). The prefix keeps CI's groups apart.
concurrency:
  group: secrets-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    # The bound covers the install script's worst case for its one download (6 minutes) and a far larger history.
    timeout-minutes: 10
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Betterleaks
        run: make install-betterleaks
      - name: Check the allow lists and scan the history for secrets
        run: make secrets-history
